# P1-6 CI gate: a red test, a failed unsigned Android Release compile (the product target — the
# Windows head is only a dev harness), or a leaked secret fails the pipeline.
#
# Vulnerability gate (honest wording): the repo's Directory.Build.props already promotes HIGH and
# CRITICAL NuGet advisories (NU1903/NU1904) to build errors — dotnet test/build below inherit it.
# It does NOT fail every vulnerable package; NU1900 (advisory data unavailable) is deliberately
# not an error so offline restores still build.
#
# Actions pinned at @v5: the first run warned that checkout/setup-dotnet/setup-java @v4 target
# Node 20, which is deprecated and was already being force-run on Node 24. Bumped before that
# turns into a hard failure.
name: CI

on:
  push:
    branches: [main, 'hardening/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Unpiped on purpose (V2_FOLLOWUPS §4.4): piping through tail/head swallows the exit code.
      - name: Run tests
        run: dotnet test Grocery_Sense/GrocerySense.Tests

  # The first run (2026-08-01) FAILED here and the fix is already in: the App used to declare
  # TargetFrameworks = android;ios;maccatalyst unconditionally, so this Linux runner tried to resolve
  # an iOS pack it cannot have — "workload packs that do not exist in any of the workloads available
  # in this installation: Microsoft.iOS.Sdk.net10.0_26.5". Note it failed at the COMPILE step, not at
  # restore: `dotnet workload restore` exits clean and the build is what breaks, so NETSDK1147 is not
  # the symptom to look for. The csproj now enumerates iOS/macCatalyst only on macOS.
  # If this job ever fails that way again, the alternative is moving it to a macOS runner.
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the workloads this project declares
        run: dotnet workload restore Grocery_Sense/GrocerySense.App/GrocerySense.App.csproj
      - name: Unsigned Android Release compile
        run: dotnet build Grocery_Sense/GrocerySense.App -f net10.0-android -c Release

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — the scan covers every commit ever pushed, not just the tip
      # Version-pinned binary rather than a third-party action; --redact keeps any hit out of CI logs.
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
