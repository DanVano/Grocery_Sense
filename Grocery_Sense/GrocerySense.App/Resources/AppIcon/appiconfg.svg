        <!-- wheels -->
        <circle cx="202" cy="306" r="17" fill="#ffffff" />
        <circle cx="306" cy="306" r="17" fill="#ffffff" />
        <!-- leaf sprouting from the top rail -->
        <path d="M 298 182 Q 300 118 346 104 Q 338 158 298 182 Z" fill="#ffffff" />
