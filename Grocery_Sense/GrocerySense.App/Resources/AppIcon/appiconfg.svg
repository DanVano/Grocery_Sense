        <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
            <!-- handle + basket outline -->
            <path d="M 112 156 L 150 156 L 180 260 L 326 260 L 352 192 L 168 192" />
            <!-- legs down to the wheels -->
            <path d="M 196 260 L 202 288" />
            <path d="M 312 260 L 306 288" />
